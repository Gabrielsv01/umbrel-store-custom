<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- bluealsad runs as root inside the container; only root may own this name. -->
  <policy user="root">
    <allow own="org.bluealsa"/>
  </policy>

  <!-- Any client (bluetoothctl, aplay/bluealsa-pcm, the app itself) may call
       methods on / receive signals from the bluealsa service. -->
  <policy context="default">
    <allow send_destination="org.bluealsa"/>
    <allow receive_sender="org.bluealsa"/>
  </policy>
</busconfig>
