version: "3.7"
services:
  bluetooth-api-manager:
    image: gabrielsv01/bluetooth-api-manager:1.7.9-native
    container_name: bluetooth-api-manager
    environment:
      - PORT=5157
      # Timezone used by the play Scheduler. Set to your zone, e.g.
      # America/Sao_Paulo, so scheduled times match your wall clock.
      - TZ=${TZ:-UTC}
      # Piper TTS worker (the piper service below, on the host network).
      - PIPER_URL=http://127.0.0.1:5158
      - PICOCLAW_URL=http://0.0.0.0:5144
      - PICOCLAW_TOKEN=YOUR_PICO_TOKEN
      # Optional alternative TTS engine: a separately-running Kokoro container
      # (OpenAI-compatible API), offered next to Piper on the Voz tab. Called
      # directly by the backend (not the browser), so a container-internal or
      # localhost address works fine — adjust the port to match your Kokoro
      # container. Leave empty to hide the Kokoro option.
      - KOKORO_URL=http://0.0.0.0:5142/
      # Default Navidrome URL (can be changed here per installation).
      - NAVIDROME_URL=http://0.0.0.0:4533/
      # Base URL of the "Music Tag" app (gabriel-store-music-tag), used to build
      # the "editar informações da música" link in the player's menu. This is
      # opened by the USER'S BROWSER, so it must be an address it can reach —
      # your Umbrel device's LAN hostname/IP, not a container-internal one.
      # Leave empty to hide that menu item.
      - MUSIC_TAG_URL=http://0.0.0.0:5150/
      # Auto-delete generated/uploaded audio older than this many days
      # (files referenced by a schedule are always kept).
      - AUDIO_RETENTION_DAYS=1
      # Seconds of throwaway "warm-up" silence used on a RECOVERY re-prime (after
      # a forced reconnect): the first PCM open glitches on some speakers, so this
      # silent open takes the hit and the real track — a clean second open — comes
      # out right. 1-2s is plenty.
      - AUDIO_RECONNECT_DELAY=1.5
      # Longer silent lead-in for a COLD A2DP link (first play, or first after the
      # warm window expired). Covers the speaker's wake-from-standby latency:
      # Echo/Alexa keep the link up while asleep, so a short warm-up isn't enough
      # and the real track plays into a still-waking speaker (heard as "the first
      # message didn't play"). Raise toward 5-6s if a first play is still swallowed.
      - AUDIO_COLD_WARMUP=4.0
      # Reconnect the last-used speaker while idle. Set to 0 to disable.
      - AUDIO_KEEPALIVE_INTERVAL=20
    # Host networking + privileged give the container direct access to the HCI
    # Bluetooth adapter. The app shares the HOST's bluetoothd/D-Bus system bus
    # (bind-mounted below) instead of running its own — only bluez-alsa and
    # obexd run inside the container.
    #
    # IMPORTANT: the host's own bluetooth service must be ENABLED and running
    # (this is the opposite of older versions of this app, which required
    # disabling it) — it's now the sole owner of the adapter:
    #     sudo systemctl enable --now bluetooth
    network_mode: host
    privileged: true
    volumes:
      # Persist uploaded audio/files, received files and app state.
      - ${APP_DATA_DIR:-./data}/data:/data
      # Persist BlueZ pairings + cached device names so they survive restarts
      # and app updates (otherwise every restart forgets paired speakers).
      - ${APP_DATA_DIR:-./data}/bluetooth:/var/lib/bluetooth
      # Share the host's D-Bus system bus so bluetoothctl/bleak/bluez-alsa talk
      # to the host's own bluetoothd instead of a private one in the container.
      - /run/dbus:/run/dbus
      # Read-write: lets the entrypoint install the org.bluealsa D-Bus policy
      # onto the host (the host has no bluez-alsa package, so it ships none) —
      # without it bluealsad can't own its D-Bus name and crash-loops forever.
      - /etc/dbus-1/system.d:/etc/dbus-1/system.d
    restart: unless-stopped

  # Piper text-to-speech worker. Isolated so the heavy ONNX runtime stays out of
  # the main image. Downloads the pt-BR Razo voice into the voices volume on
  # first run. Host network so the main app reaches it at 127.0.0.1:5158.
  piper:
    # To rebuild locally: `docker build -t gabrielsv01/piper-tts-box:1.0.3 ./code/piper`
    image: gabrielsv01/piper-tts-box:1.0.3
    container_name: bluetooth-piper-tts
    environment:
      - PORT=5158
      - VOICES_DIR=/voices
      # Default voice tuning (each request can still override). Uncomment to set:
      - PIPER_LENGTH_SCALE=1.0       # speed: >1 slower, <1 faster
      - PIPER_NOISE_SCALE=0.667      # expressiveness / variability
      - PIPER_NOISE_W=0.8            # cadence (timing) variability
      - PIPER_SENTENCE_SILENCE=0.3   # pause between sentences (seconds)
    # Low idle memory by design: each synthesis runs in a short-lived subprocess
    # that frees all model memory (~120 MiB) on exit. Idle footprint stays small.
    network_mode: host
    volumes:
      # Voice models (.onnx + .onnx.json). Persisted so they download only once.
      - ${APP_DATA_DIR:-./data}/voices:/voices
    restart: unless-stopped
