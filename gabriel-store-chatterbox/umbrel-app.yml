support: https://github.com/Gabrielsv01/umbrel-store-custom/issues
gallery: []
releaseNotes: >-
  1.0.5: LAZY_LOAD_ENABLED (default true) — the model no longer loads at
  container startup, only on the first /tts/jobs request, so the UI/Swagger
  are usable at ~350MB RAM until then. Combined with 1.0.3's idle-unload
  (also now on by default), the ~6.5GB model is only ever in RAM while
  actually being used. 1.0.3: optional IDLE_UNLOAD_ENABLED/IDLE_UNLOAD_MINUTES to free the model
  (~6.5GB RAM) after a period of inactivity, reloading automatically on the
  next request — useful on RAM-constrained hosts. Off by default; no image
  change needed to opt out. 1.0.2: moved off port 5158 (collided with
  gabriel-store-bluetooh-api-manager's "piper" helper, which binds that port
  in host networking) to port 5160 — no image change. 1.0.1: async /tts/jobs +
  GET /tts/jobs/{id} for progress polling, /outputs history (auto-cleaned via
  OUTPUT_RETENTION_DAYS), a built-in web UI to drive the whole API, and a fix
  for the default voice getting stuck on the last voice-cloned request.
  1.0.0: first release. FastAPI wrapper (Swagger UI at /docs) around the
  ResembleAI/Chatterbox-Multilingual-pt-br checkpoint, with a /tts endpoint
  exposing exaggeration, cfg_weight, temperature, repetition_penalty, min_p,
  top_p, seed and voice cloning (one-off upload or saved /voices), plus
  /languages and /health. CPU-only image.
dependencies: []
path: "/"
defaultUsername: ""
defaultPassword: ""
