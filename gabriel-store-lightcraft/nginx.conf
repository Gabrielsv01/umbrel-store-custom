server {
    listen 80;
    server_name localhost;
    
    root /usr/share/nginx/html;
    index index.html;

    # Ativa compressão para reduzir o .wasm de 13MB para ~5MB
    gzip on;
    gzip_types application/wasm text/javascript text/html;

    # Garante os MIME types corretos
    include /etc/nginx/mime.types;
    types {
        application/wasm wasm;
    }

    # Cache infinito para os arquivos JS e WASM (já que possuem hash no nome)
    location ~* \.(wasm|js)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Força a revalidação do index.html sempre
    location ~* index\.html$ {
        add_header Cache-Control "no-cache";
    }
}