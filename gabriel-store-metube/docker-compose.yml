version: '3'

services:
  metube:
    image: ghcr.io/alexta69/metube:2026.08.04
    container_name: metube
    restart: unless-stopped
    ports:
      - "5152:8081"
    environment:
      - 'YTDL_OPTIONS={"nocheckcertificate": true}'
    volumes:
      - "${UMBREL_ROOT}/home/Downloads:/downloads"
      