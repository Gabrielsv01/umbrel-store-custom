<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TeleRedirect — Login</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 480px; margin: 4rem auto; padding: 1rem;
           background: #0f172a; color: #e2e8f0; }
    h1 { color: #38bdf8; font-size: 1.3rem; }
    label { display: block; margin-top: 1rem; margin-bottom: 0.25rem; color: #94a3b8; font-size: 0.9rem; }
    input { width: 100%; padding: 0.5rem; border-radius: 6px; border: 1px solid #334155;
            background: #1e293b; color: #e2e8f0; font-size: 1rem; box-sizing: border-box; }
    button { margin-top: 1.25rem; padding: 0.6rem 1.2rem; border-radius: 6px; border: none;
             background: #38bdf8; color: #0f172a; font-weight: 600; cursor: pointer; }
    button:hover { background: #7dd3fc; }
    .error { color: #f87171; }
    .hint { color: #94a3b8; font-size: 0.85rem; }
  </style>
</head>
<body>
  <h1>🔐 TeleRedirect — Login no Telegram</h1>
  {% if error %}<p class="error">⚠️ {{ error }}</p>{% endif %}

  {% if step == 'phone' %}
    <form method="post" action="{{ url_for('login_send_code') }}">
      <label>Telefone (com código do país, ex.: +5511999999999)</label>
      <input type="text" name="phone" required autofocus>
      <button type="submit">Enviar código</button>
    </form>
  {% elif step == 'code' %}
    <form method="post" action="{{ url_for('login_sign_in') }}">
      <label>Código recebido no Telegram</label>
      <input type="text" name="code" inputmode="numeric" required autofocus>
      <button type="submit">Confirmar</button>
    </form>
    <p class="hint">O código chega no próprio app do Telegram (ou por SMS), não aqui na página.</p>
  {% elif step == 'password' %}
    <form method="post" action="{{ url_for('login_password') }}">
      <label>Sua conta tem verificação em duas etapas — digite a senha</label>
      <input type="password" name="password" required autofocus>
      <button type="submit">Confirmar</button>
    </form>
  {% endif %}
</body>
</html>
