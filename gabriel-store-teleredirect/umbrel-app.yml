manifestVersion: 1
id: gabriel-store-teleredirect
name: TeleRedirect
tagline: Cache and re-forward Telegram bot media, with a web player and live streaming
icon: https://raw.githubusercontent.com/Gabrielsv01/umbrel-store-custom/main/gabriel-store-teleredirect/icon.svg
category: media
version: "1.0.0"
port: 5153
description: >-
  TeleRedirect sits between a Telegram bot and a destination group/chat and
  re-forwards what it receives — useful for bots that block Telegram's native
  forward.


  Features:

  - Listens to a specific bot, downloads text/media it sends, and re-sends it
    to your configured group as if it were new.

  - Media is cached to local disk and reachable through a local streaming
    proxy (/stream/...), so the group message links straight to your own
    server instead of re-uploading through Telegram every time.

  - Watch media directly from the built-in web library while it is still
    downloading — a smart player tracks how much is cached and only lets you
    seek into what already exists, with live download/upload progress.

  - Automatically detects Matroska (.mkv) files mislabeled as .mp4 and remuxes
    them (stream copy, no re-encode) into a browser-playable .web.mp4, including
    partial previews while the download is still in progress.

  - Pause, resume, or delete an in-progress item from the web UI; login
    (phone/code/2FA) happens on the app's own page — no separate setup step.


  A REST API is available under /api for the media library and download/upload
  progress.
