version: "3.7"

services:
  zrok:
    image: openziti/zrok:latest
    container_name: zrok_tunnel
    tty: true
    stdin_open: true
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e

        # 1. Só ativa o ambiente se ainda não existir (evita criar identidades novas a cada restart)
        if [ -f "$$HOME/.zrok/environment.json" ]; then
          echo "Ambiente zrok já habilitado, pulando enable."
        else
          echo "Habilitando ambiente zrok..."
          zrok enable $$ZROK_ENABLE_TOKEN --headless
        fi

        # 2. Só reserva se a reserva 'domain-reserved' ainda não existir
        if zrok overview 2>/dev/null | grep -q "domain-reserved"; then
          echo "Reserva 'domain-reserved' já existe, pulando reserve."
        else
          echo "Criando reserva 'domain-reserved'..."
          zrok reserve public localhost:5124 --backend-mode proxy --unique-name domain-reserved
        fi

        # 3. Abre o túnel definitivo
        exec zrok share reserved domain-reserved --headless
    environment:
      - ZROK_ENABLE_TOKEN=secret_token_here
    volumes:
      - ${APP_DATA_DIR}/zrok:/home/ziggy/.zrok
    network_mode: host
    restart: unless-stopped