version: '3.7'
services:
  zrok:
    image: openziti/zrok:latest
    container_name: zrok_tunnel
    tty: true
    stdin_open: true
    environment:
      - ZROK_ENABLE_TOKEN=secret_token_here
    network_mode: host
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - '-c'
      - >
        # 1. Ativa o ambiente (se já estiver ativo, ignora)

        zrok enable $$ZROK_ENABLE_TOKEN --headless || true


        # 2. Reserva usando apenas letras minúsculas e números (sem hífen)

        zrok reserve public localhost:5124 --backend-mode proxy --unique-name
        domainreserved || true


        # 3. Abre o túnel definitivo

        zrok share reserved domainreserved --headless
